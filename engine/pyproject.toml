[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbgyanx-engine"
dynamic = ["version"]
description = "Open-source TCP/NTCP radiobiology engine for rbGyanX CDSS (DICOM + multi-site)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "rbGyanX Team"}]
keywords = ["radiotherapy", "TCP", "NTCP", "DVH", "DICOM", "CDSS", "radiobiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydicom>=2.4.0,<3.0",  # dicompyler-core 0.5.6 imports pydicom.pixel_data_handlers (removed in pydicom 3.0)
    "dicompyler-core>=0.5.5",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "joblib>=1.2",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
ml = [
    "lifelines>=0.27",
    "xgboost>=1.7",
    "lightgbm>=4.0",
    "shap>=0.41",
    "lime>=0.2",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "black>=24.0", "ruff>=0.4"]

[project.scripts]
rbgyanx-engine = "rbgyanx_engine.__main__:main"
# the cohort runner's own --help advertises this name, but no entry point declared it, so
# `rbgyanx-cohort` did not exist after install and only `python scripts/run_cohort.py` worked
rbgyanx-cohort = "rbgyanx_engine.cohort_runner:main"

[project.urls]
Homepage = "https://github.com/kalyan2031990/rbGyanX_cdss"
Documentation = "https://github.com/kalyan2031990/rbGyanX_cdss#readme"

[tool.setuptools.dynamic]
version = { attr = "rbgyanx_engine._version.__version__" }

[tool.setuptools.packages.find]
where = [".", "tests"]
include = [
    "rbgyanx_engine*",
    "dicom_io*",
    "config*",
    "radiobiology*",
    "uncertainty*",
    "statistical_models*",
    "ml_models*",
    "xai*",
    "validation*",
    "outputs*",
    "synthetic_data*",
]
exclude = ["tests/test_*", "examples*", "archive*", "quantification*", "src*"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.pytest.ini_options]
# Defect #50. pytest picks its rootdir by walking UP from the arguments to the nearest ancestor
# carrying a pytest config, so `pytest engine/tests` from the repository root stops here and uses
# this file -- not the root pyproject.toml. The root `addopts` and marker list were therefore
# silently dropped: `--strict-markers` was off (a typo in a marker name would pass unnoticed) and
# the import mode fell back to prepend. The load-bearing options are duplicated here so that the
# checks are the same whichever config wins, and
# `engine/tests/test_v150_pytest_config_trap.py` fails loudly if they ever diverge again.
#
# The genuinely engine-local settings are testpaths and pythonpath; everything below mirrors the
# repository root and must be kept in step with it.
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--import-mode=importlib",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: fast isolated unit test",
    "integration: crosses module boundaries",
    "e2e: full pipeline test",
    "slow: long-running (skip in quick CI unless --runslow)",
    "requires_ml: needs xgboost/lightgbm stack",
    "requires_torch: needs PyTorch",
    "requires_pymc: needs PyMC",
    "requires_dicom: needs DICOM fixtures or local cohort",
    "requires_xgboost: needs xgboost",
    "requires_lifelines: needs lifelines",
    "dicom: synthetic or real DICOM round-trip",
    # Added for defect #46. The CI core job used to name 65 of 134 test files explicitly, so
    # widening it meant editing a path list; with a marker, an exclusion has to be declared on
    # the test itself and carries a reason in the file that is excluded. Nothing is marked with
    # it today: every file in the default selection was measured and none needs excluding.
    "legacy: exercises quarantined lineage code under legacy/; excluded from the CI core job",
]
