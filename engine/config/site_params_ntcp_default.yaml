          as_printed_ci_95: {s: "0.04-0.07", gamma: "0.88-2.35", D50_gy: "39.5-48.5"}
          conversion: >-
            none. The engine's RS block takes {D50_gy, gamma, s}, which is exactly the paper's
            relative-seriality parameterisation, so the values transfer as printed. s = 0.05
            indicates an almost fully parallel organ, consistent with the LKB n of 0.92. The
            fit's dose basis is EQD2 at alpha/beta 3 Gy, which is this organ's alpha_beta_gy. The engine applies that EQD2 transform only when the plan states its fractionation: with
