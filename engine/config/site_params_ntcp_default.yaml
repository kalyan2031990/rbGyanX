# NTCP organ parameters by tumour site key (matches the TCP site_params_key).
#
# Every value carries a `provenance` block, per model, giving its source, the table and page it
# was transcribed from, the endpoint it was fitted to, the dose basis, and what the structure was
# in the paper. A value with no published source is marked `illustrative: true` and BASIC mode
# refuses it; ADVANCED mode computes it and labels every row `param_illustrative`.
#
# `as_printed` holds the numbers exactly as the paper prints them. Nothing is converted or rounded
# silently: `conversion` states every derivation, and the only one used here is
# geud_a = 1/n, which is the Kutcher-Burman DVH reduction the LKB probit model assumes.
#
# Sources read for this file:
#   Burman C, Kutcher GJ, Emami B, Goitein M. Fitting of normal tissue tolerance data to an
#     analytic function. IJROBP 21:123-135 (1991). Table 1, p. 125.
#   Rancati T, Fiorino C, Fellin G, et al. NTCP modeling of subacute/late laryngeal edema scored
#     by fiberoptic examination. IJROBP 75:915-923 (2009). p. 919.
#   Bakhshandeh M, Hashemi B, Mahdavi SRM, et al. Normal tissue complication probability modeling
#     of radiation-induced hypothyroidism after head-and-neck radiation therapy. IJROBP
#     85(2):514-521 (2013). Table 2, p. 517.
#
# Override anything here in site_params_ntcp_user.yaml.
#
# Maintained by hand. Each value's own `provenance` block is the record of where it came from, so
# the transcription is checkable from this file alone without any external document.

