          as_printed_ci_95: {n: "0.45-3", m: "0.16-0.42", TD50_gy: "40.3-48.3"}
          conversion: >-
            none on the fitted values; geud_a = 1/n = 1.087 (1/0.92), the Kutcher-Burman reduction
            the LKB probit model is defined on. n close to 1 means the response is close to a
            mean-dose one, which is the parallel architecture the authors conclude for the gland.
            The fit's dose basis is EQD2 at alpha/beta 3 Gy, which is this organ's alpha_beta_gy. The engine applies that EQD2 transform only when the plan states its fractionation: with
            the fractionation unstated the NTCP is computed on PHYSICAL dose and the row is
            labelled ntcp_dose_basis physical, which does NOT match this fit's basis. Read
            that column before comparing a value against the published one.
          replaces: "LKB_loglogit TD50_gy 37.7, gamma50 0.7 (unsourced)"
          alternative_fit: >-
            Table 4, p. 519 of the same paper fits the narrower endpoint of CLINICAL hypothyroidism
            only, giving n 0.49, m 0.24, D50 60 Gy (95% CI 56-70). That is the more tolerant and
            more conservative choice. Table 2 is the default here because its endpoint includes
            subclinical disease, which is what a DVH-based risk estimate is usually wanted for, and
            because it is the fit with the larger event count. Switch by overriding this organ in
            site_params_ntcp_user.yaml with its own provenance block.
          illustrative: false
