        LKB_probit:
          source: "Bakhshandeh M, Hashemi B, Mahdavi SRM, et al. IJROBP 85(2):514-521 (2013)"
          table_page: "Bakhshandeh 2013, Table 2, p. 517 (Lyman EUD row)"
          endpoint: "any (clinical or subclinical) hypothyroidism within 1 year"
          fractionation_basis: "EQD2, alpha/beta 3 Gy"
          structure_definition: >-
            thyroid gland. The fit is derived from a head-and-neck cohort (65 patients, mean gland
            volume 14.84 mL) and is applied here to the incidental irradiation a breast plan
            delivers, which is a different dose distribution. The parameters are the best published
            ones for this gland and endpoint; the cohort they came from is not the cohort they are
            applied to.
