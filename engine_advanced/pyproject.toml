[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbgyanx-advanced"
version = "1.1.0"
description = "ADVANCED-mode extensions: covariates, dosiomics, PINN stubs, 3D dose"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
pinn = ["torch>=2.1.0"]
# pydicom is capped below 3.0 for the same reason as the core package: dicompyler-core
# 0.5.6 still imports pydicom.dicomio.read_file, which pydicom 3 removed, and its import
# guard then falls back to the obsolete "dicom" distribution and reads nothing.
dose3d = ["pydicom>=2.4,<3.0", "scikit-image>=0.22"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rbgyanx_advanced*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../engine"]
