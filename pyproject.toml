[build-system]
# setuptools >= 83 closes PYSEC-2026-3447 (MANIFEST.in exclude directives could be bypassed by a
# Unicode-normalisation mismatch when building an sdist on macOS APFS/HFS+, so an excluded file
# could be packaged). pip-audit is a blocking CI gate, so this floor is load-bearing, not cosmetic.
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbgyanx"
version = "1.3.0"
description = "Radiobiology clinical decision support system (TCP/NTCP/UTCP/QUANTEC)"
readme = "README.md"
license = { text = "MIT" }
# Exactly the matrix CI tests (ubuntu + windows x 3.10/3.11/3.12). The upper bound means
# "not tested", not "known broken": the pinned dependencies do resolve on 3.13, but nothing
# verifies the numerics there, so support is not claimed. Widening this should mean adding
# 3.13 to the CI matrix in the same change, never just raising the cap.
#
# This is NOT the interpreter the published analysis ran on. analysis/FINAL_ANALYSIS_CODE_MANIFEST.json
# records Python 3.14.2 with its own package set; that analysis drove the engine directly rather
# than this installed distribution. Both records are accurate about different environments.
requires-python = ">=3.10,<3.13"
authors = [{ name = "Kalyan Mondal" }]
keywords = ["radiotherapy", "TCP", "NTCP", "DVH", "DICOM", "radiobiology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pydicom>=2.4,<3.0",  # dicompyler-core 0.5.6 imports pydicom.pixel_data_handlers (removed in pydicom 3.0)
    "dicompyler-core>=0.5.5",
    "scikit-learn>=1.3",
    "joblib>=1.2",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-randomly>=3.15",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "cffconvert>=2.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
ml = [
    "xgboost>=1.7",
    "lightgbm>=4.0",
    "lifelines>=0.27",
    "shap>=0.41",
    "lime>=0.2",
    "seaborn>=0.12",  # plotting for legacy code3/code6, exercised by the full-stack tests
]
torch = ["torch>=2.1"]
# Qt6 desktop interface (v2). Optional: the Tkinter app and the engine work without it.
# QtWebEngine (in PySide6-Addons) hosts the interactive Plotly views.
qt = ["PySide6>=6.6", "plotly>=5.18"]
bayesian = ["pymc>=5.0", "arviz>=0.16"]
# Install all extras: pip install -e ".[dev,ml,torch,bayesian]" plus editable sub-packages

[project.urls]
Homepage = "https://github.com/kalyan2031990/rbGyanX"
Repository = "https://github.com/kalyan2031990/rbGyanX"
Documentation = "https://github.com/kalyan2031990/rbGyanX/blob/main/docs/TECHNICAL_DEVELOPMENT_NOTE.md"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "rbgyanx*",
    "clinical*",
    "utils*",
    "models*",
    "qa*",
]
exclude = ["engine*", "engine_advanced*", "engine_advanced_f*", "tests*", "packaging*", "legacy*"]

[tool.setuptools.package-data]
# The reference packs are data the literature tool reads at run time, so they have to be in
# the wheel as well as in the checkout.
"rbgyanx.ai.reference_packs" = ["*.json"]

[tool.pytest.ini_options]
testpaths = [
    "engine/tests",
    "tests",
    "engine_advanced/tests",
    "engine_advanced_f/tests",
    "tests/synthetic",
]
python_files = ["test_*.py"]
addopts = [
    "--import-mode=importlib",
    "-q",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: fast isolated unit test",
    "integration: crosses module boundaries",
    "e2e: full pipeline test",
    "slow: long-running (skip in quick CI unless --runslow)",
    "requires_ml: needs xgboost/lightgbm stack",
    "requires_torch: needs PyTorch",
    "requires_pymc: needs PyMC",
    "requires_dicom: needs DICOM fixtures or local cohort",
    "requires_xgboost: needs xgboost",
    "requires_lifelines: needs lifelines",
    "dicom: synthetic or real DICOM round-trip",
]
filterwarnings = [
    "ignore::UserWarning:lifelines",
    "ignore::FutureWarning:sklearn",
]

[tool.coverage.run]
source = ["engine", "rbgyanx", "engine_advanced", "engine_advanced_f"]
omit = ["*/tests/*", "*/test_*.py", "*/conftest.py", "legacy/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["engine", "engine_advanced", "engine_advanced_f", "rbgyanx", "tests", "scripts"]
# Excluded from linting, for two different reasons:
#   legacy/   quarantined lineage code — retired, never imported. See legacy/README.md.
#   analysis/ the versioned record of the published analysis. Its scripts are pinned by SHA-256
#             in analysis/FINAL_ANALYSIS_CODE_MANIFEST.json, which maps each reported result to
#             the exact bytes that produced it. Reformatting them — even cosmetically — breaks
#             that mapping, so they are frozen provenance artefacts rather than maintained code.
#             (Linting them once during the v1.3.0 cleanup silently rewrote ten of them; the
#             edits were reverted and this exclusion added so it cannot recur.)
extend-exclude = ["legacy", "analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Ruff is a BLOCKING gate over the whole maintained tree (the narrow path allow-list CI used to
# lint is gone), so the tree is clean against this configuration and every exclusion below is a
# deliberate policy choice rather than a backlog. Around 1,450 findings were fixed to get here,
# including two genuine bugs (see F821 note below) -- these are what is left and why.
ignore = [
    "E501",   # line length: black owns formatting, and re-wrapping prose in docstrings and
              # long f-strings would churn most of the tree for no readability gain.
    "SIM102", # collapsible nested `if`: flattening these usually loses a comment that explains
              # why the outer condition is checked first. Judged per case, not enforced.
    "SIM105", # `contextlib.suppress` instead of try/except/pass: suppress() is slower in hot
              # loops and reads worse where the except body is documented; not enforced.
    "SIM108", # ternary instead of if/else: forces long expressions onto one line.
    "SIM117", # combined `with`: nesting is clearer when the inner context depends on the outer.
    "E741",   # ambiguous names (l, I, O): the remaining five are established symbols in
              # radiobiology formulae, where renaming them away from the published notation
              # would make the code harder to check against the literature, not easier.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"engine/tests/**" = ["S101"]
"scripts/**" = ["S603", "S607"]
# Submodule re-exports are imported after a helper def to avoid circular imports.
"engine/radiobiology/__init__.py" = ["E402"]
# Imports deliberately follow a pytest.importorskip("hypothesis") guard.
"tests/synthetic/test_property_invariants.py" = ["E402"]
# Bodies extracted VERBATIM from rbgyanx_gui.py (v2 Phase 4 - Slice 1). Keeping them
# byte-for-byte is what makes tests/test_gui_service_equivalence.py meaningful, so
# cosmetic rewrites (ternaries, collapsed ifs) are deliberately not applied here.
"rbgyanx/services/dvh_service.py" = ["SIM102", "SIM108"]

# --- E402: module-level import not at top of file -----------------------------------------
# Every case below is an import that MUST follow something: a sys.path insertion that makes the
# import resolvable, a pytest.importorskip guard, or a matplotlib backend selection. Moving them
# to the top would break the file.
"scripts/run_ntcp_benchmark_workspace.py" = ["E402"]
"scripts/verify_gui_modes.py" = ["E402"]
"scripts/audit_spark_dataset.py" = ["E402"]
"utils/tcp_models.py" = ["E402"]
"tests/test_ntcp_models_core.py" = ["E402"]
"engine/tests/test_statistical_models.py" = ["E402"]
"engine_advanced/tests/test_pinn_registry.py" = ["E402"]
"engine_advanced_f/tests/test_train_pinn.py" = ["E402"]
"engine_advanced_f/tests/test_part_f_integration.py" = ["E402"]
"engine_advanced_f/tests/test_bayesian_ntcp.py" = ["E402"]
"rbgyanx/core/ntcp/rs_poisson.py" = ["E402"]
"rbgyanx/core/ntcp/lkb_probit.py" = ["E402"]
"rbgyanx/core/ntcp/lkb_loglogit.py" = ["E402"]

# --- F401: unused import ------------------------------------------------------------------
# These are optional-dependency availability probes: the module is imported inside a try/except
# ImportError purely to discover whether the feature can be offered, and a module-level
# *_AVAILABLE flag records the answer. Ruff suggests importlib.util.find_spec, which would be a
# behaviour change (find_spec finds a module that then fails to import), so the probe stays and
# the rule is switched off for these files only.
"rbgyanx/ui/advanced_dashboard.py" = ["F401"]
"qa/self_test_engine.py" = ["F401"]
"qa/qa_overfitting.py" = ["F401"]
"utils/dvh_parser.py" = ["F401"]
"ai/local_llm_engine.py" = ["F401"]
"engine_advanced/rbgyanx_advanced/pinn/models/pinn_base.py" = ["F401"]
"engine_advanced/rbgyanx_advanced/pinn/training/physics_loss.py" = ["F401"]

[tool.bandit]
# Bandit is a BLOCKING gate in CI (the `|| true` that used to mask it is gone), so every finding
# is either fixed or listed here with a reason. Nothing is skipped for convenience.
#
# Skipped, with justification:
#   B404 subprocess import          - the pipeline deliberately wraps the code1-7 analysis
#   B603 subprocess without shell   - scripts as subprocesses. Every call site passes a fixed
#   B607 partial executable path      argv LIST with shell=False, which is the form B603 exists
#                                     to steer people towards; the flag is an audit prompt, not
#                                     a defect. Commands are built from sys.executable and
#                                     repo-relative paths, never from user text. B607 is the
#                                     `git rev-parse HEAD` provenance call, where hardcoding an
#                                     absolute path to git would break portability.
#
# Deliberately NOT skipped: B602 (shell=True) stays blocking, which is the finding that would
# actually indicate a shell-injection risk. Individual accepted try/except/pass and
# try/except/continue sites carry inline `# nosec B110`/`# nosec B112` with a per-site reason,
# rather than a blanket skip, so a careless new swallow is still caught.
skips = ["B404", "B603", "B607"]
exclude_dirs = ["legacy", "tests", "engine/tests", "engine_advanced", "engine_advanced_f"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
# 3.12 so mypy can parse numpy >= 2.4's PEP 695 `type` statements in its bundled stubs.
# Runtime compatibility with 3.10/3.11 is verified by the pytest matrix, not by mypy.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "radiobiology.*",
]
disallow_untyped_defs = true
check_untyped_defs = true
